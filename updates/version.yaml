1.0.0:
    - "Initial version — color extraction and taxonomy classification"
    - create_color_entries_table.php
1.0.1:
    - "Add cropped image data column for 50x50 center crop preview"
    - add_cropped_image_data_column.php
1.0.2:
    - "Add detail_url column for frontend product deep links"
    - add_detail_url_column.php
1.1.0:
    - "Add compact /api/color-lab/offers.json export keyed by offer UUID with ETag / 304 caching"
1.2.0:
    - "Classification accuracy pass - honor achromatic saturation threshold, chroma-gated White, pink/red split, burgundy, tinted greys, dark browns; confidence now measures family certainty"
1.3.0:
    - "Add global last_updated_at to /api/color-lab/offers.json and /api/color-lab/data so consumers can see when color data last changed"
1.4.0:
    - "Add GET /api/color-lab/families.json - family taxonomy export keyed by stable family slug (localized names, per-locale synonyms, canonical swatch hex) with the same ETag / If-None-Match 304 conventions as offers.json, so an external store can build localized color search and catalog filters"
1.5.0:
    - "Confidence flows to consumers: families.json key order becomes a deliberate contract - families ordered by average ColorEntry confidence descending (confidently classified families first, boundary-straddling ones sink), families without classified offers last, hand-curated taxonomy order breaking ties - and offers.json adds a per-offer confidence field (null when unscored) so a consumer store can order the shades inside a family by classification certainty; consumer stores render pills in payload order"
1.5.1:
    - "families.json order reverts to the hand-curated taxonomy order (spectral Red through Black) - the confidence-derived family order opened the pill row with Green, which reads as arbitrary to shoppers (owner rejection 2026-08-15); order stays a contract, edit the taxonomy to reorder. Per-offer confidence in offers.json is unchanged and keeps ordering shades inside a family"
1.5.2:
    - "offers.json version stamp now hashes the encoded exported rows, so payload shape changes (like the 1.5.0 confidence field) rotate the ETag instead of letting consumers 304 forever on a stale body; the stamp rotates once on deploy. Shared EtagRevalidation helper deduplicates the route cache blocks and matches If-None-Match tolerantly (W/ prefix, ETag lists, nginx -gzip suffix). FamilyExportBuilder now throws on a malformed or duplicate curated family slug instead of silently dropping it"
1.5.3:
    - "Color Lab memory diet: /api/color-lab/data, offers.json and the backend CSV export select every column except the cropped_image_data base64 blobs (about 14 KB per row) they never render. All three Color Lab payloads are cached via ColorLabPayloadCache and flushed whenever a ColorEntry saves or deletes, so an offers.json If-None-Match revalidation costs a cache read instead of a table load. /tools/color-lab responds with Cache-Control public max-age=3600 and serves its entries JSON pre-encoded from the cache"
1.6.0:
    - "Color families table (23 seeded families, lt and nb-no names added) edited on a Families page, per-offer family and hex override with a lock that Process All skips, effective values in offers.json, families.json and the Color Lab, Family board, and a Color entries edit form with lock filters"
    - create_color_families_table.php
    - seed_color_families_table.php
    - add_override_columns_to_color_entries.php
1.7.0:
    - "Collections from the 1C Kolekcija characteristic live in the same family list as the colors (kind column, 1C link, optional 2-3 stop gradient), and one offer can sit in several families through a memberships table. families.json adds kind and gradient and leaves out inactive collections, offers.json adds families (primary first) and shade_code. The Family board shows an offer in every group it belongs to, asks Move or Clone when you drop it on a group of the same kind, adds it without asking when you drop a color on a collection or the reverse, and lets you remove a membership or reset a collection to 1C"
    - add_kind_and_feed_link_to_color_families.php
    - create_family_memberships_table.php
1.7.1:
    - "The 1C collection sync creates a new collection active, with the grey swatch and the 1C name, so it reaches the shops at their next color sync. The sync never writes Active on an existing collection, so a collection switched off on the Families page stays off and keeps its 1C members, and 1C taking its last member away no longer stops the hourly sync. The Family board labels every inactive family inactive"
1.7.2:
    - "A collection follows the 1C file: the hourly sync switches it off when no offer carries it any more and on again when 1C carries it again. A collection switched off on the Families page stays off. A collection dropping to zero no longer stops the sync, and --allow-empty is gone; an empty, truncated or old-shape catalog still writes nothing"
    - add_hand_disabled_to_color_families.php
