1.0.0:
    - "Initial version — color extraction and taxonomy classification"
    - create_color_entries_table.php
1.0.1:
    - "Add cropped image data column for 50x50 center crop preview"
    - add_cropped_image_data_column.php
1.0.2:
    - "Add detail_url column for frontend product deep links"
    - add_detail_url_column.php
1.1.0:
    - "Add compact /api/color-lab/offers.json export keyed by offer UUID with ETag / 304 caching"
1.2.0:
    - "Classification accuracy pass - honor achromatic saturation threshold, chroma-gated White, pink/red split, burgundy, tinted greys, dark browns; confidence now measures family certainty"
1.3.0:
    - "Add global last_updated_at to /api/color-lab/offers.json and /api/color-lab/data so consumers can see when color data last changed"
1.4.0:
    - "Add GET /api/color-lab/families.json - family taxonomy export keyed by stable family slug (localized names, per-locale synonyms, canonical swatch hex) with the same ETag / If-None-Match 304 conventions as offers.json, so an external store can build localized color search and catalog filters"
1.5.0:
    - "Confidence flows to consumers: families.json key order becomes a deliberate contract - families ordered by average ColorEntry confidence descending (confidently classified families first, boundary-straddling ones sink), families without classified offers last, hand-curated taxonomy order breaking ties - and offers.json adds a per-offer confidence field (null when unscored) so a consumer store can order the shades inside a family by classification certainty; consumer stores render pills in payload order"
1.5.1:
    - "families.json order reverts to the hand-curated taxonomy order (spectral Red through Black) - the confidence-derived family order opened the pill row with Green, which reads as arbitrary to shoppers (owner rejection 2026-08-15); order stays a contract, edit the taxonomy to reorder. Per-offer confidence in offers.json is unchanged and keeps ordering shades inside a family"
1.5.2:
    - "offers.json version stamp now hashes the encoded exported rows, so payload shape changes (like the 1.5.0 confidence field) rotate the ETag instead of letting consumers 304 forever on a stale body; the stamp rotates once on deploy. Shared EtagRevalidation helper deduplicates the route cache blocks and matches If-None-Match tolerantly (W/ prefix, ETag lists, nginx -gzip suffix). FamilyExportBuilder now throws on a malformed or duplicate curated family slug instead of silently dropping it"
