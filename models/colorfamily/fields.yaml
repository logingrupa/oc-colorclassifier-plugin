fields:
    family:
        label: Family key
        type: text
        span: left
        required: true
        comment: English key the classifier and the shops use. Locked after create.

    slug:
        label: Slug
        type: text
        span: right
        required: true
        preset:
            field: family
            type: slug
        comment: Used in ?color= URLs. Locked after create.

    hex:
        label: Color
        type: colorpicker
        span: left
        required: true
        allowEmpty: false
        allowCustom: true
        showAlpha: false

    is_active:
        label: Active
        type: switch
        span: right
        default: true
        comment: 'Switch off to retire a family. Families are never deleted. A collection follows 1C: the sync switches it off when 1C stops carrying it and on again when it returns, unless you switched it off here.'

    is_active_rendered:
        type: partial
        path: field_is_active_rendered
        context: update
        cssClass: d-none

    is_hand_disabled:
        label: Off by hand
        type: switch
        span: right
        context: update
        disabled: true
        comment: On while you keep this collection switched off here, so the 1C sync leaves it off. Switch Active on to clear it.
        trigger:
            action: show
            field: kind
            condition: value[collection]

    gradient_stops:
        label: Gradient
        type: repeater
        span: left
        prompt: Add gradient stop
        maxItems: 3
        comment: Optional, 2 or 3 stops drawn left to right on the shop pill. The color above is the fallback.
        form:
            fields:
                stop:
                    label: Stop color
                    type: colorpicker
                    default: '#ffffff'
                    allowEmpty: false
                    allowCustom: true
                    showAlpha: false

    gradient_preview:
        type: partial
        path: field_gradient_preview
        span: right
        dependsOn: gradient_stops

    kind:
        label: Kind
        type: dropdown
        span: left
        context: update
        options:
            color: Color
            collection: Collection
        comment: Fixed when the family is created. Collections come from the 1C sync.

    feed_value_name:
        label: 1C name
        type: text
        span: right
        context: update
        disabled: true
        trigger:
            action: show
            field: kind
            condition: value[collection]

    feed_value_id:
        label: 1C value id
        type: text
        span: right
        context: update
        trigger:
            action: show
            field: kind
            condition: value[collection]

tabs:
    fields:
        names[en]:
            label: English
            type: text
            tab: Names
            required: true
        names[lv]:
            label: Latvian
            type: text
            tab: Names
        names[ru]:
            label: Russian
            type: text
            tab: Names
        names[lt]:
            label: Lithuanian
            type: text
            tab: Names
        names[nb-no]:
            label: Norwegian (nb-no)
            type: text
            tab: Names

        synonyms[en]:
            label: English synonyms
            type: taglist
            mode: array
            tab: Synonyms
        synonyms[lv]:
            label: Latvian synonyms
            type: taglist
            mode: array
            tab: Synonyms
        synonyms[ru]:
            label: Russian synonyms
            type: taglist
            mode: array
            tab: Synonyms
        synonyms[lt]:
            label: Lithuanian synonyms
            type: taglist
            mode: array
            tab: Synonyms
        synonyms[nb-no]:
            label: Norwegian (nb-no) synonyms
            type: taglist
            mode: array
            tab: Synonyms
