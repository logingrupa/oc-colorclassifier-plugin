fields:
    classifier_result:
        type: partial
        path: field_classifier_result
        span: full

    family_override:
        label: Family override
        type: dropdown
        emptyOption: Auto (classifier)
        span: left
        comment: Overrides the classifier family. Only active families can be chosen.

    hex_override:
        label: Hex override
        type: colorpicker
        allowEmpty: true
        allowCustom: true
        showAlpha: false
        span: right
        comment: Replaces the exported hex, hue and lightness. Leave empty to keep the classifier color.

    is_locked:
        label: Locked
        type: switch
        span: full
        comment: Process All skips locked offers. Saving an override locks the row.
